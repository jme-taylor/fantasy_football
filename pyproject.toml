[project]
name = "fantasy-football"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = "~=3.12"
readme = "README.md"
dependencies = [
    "requests>=2.31.0,<3",
    "beautifulsoup4>=4.12.3,<5",
    "duckdb>=1.0,<2",
    "python-dotenv>=1.0.0,<2",
    "pydantic>=2.5.3,<3",
    "numpy>=2.2.4,<3",
    "scikit-learn>=1.6.1",
    "mlflow>=3",
    "scraperfc",
    "pulp>=3.3.2",
    "polars>=1.44.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6.2,<0.7",
    "pytest>=8.3.5,<9",
    "pytest-mock>=3.14.0,<4",
    "pytest-cov>=6.1.1",
    "ty==0.0.70",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fantasy_football"]

[tool.ruff]
line-length=79
include = ["*.py"]

[tool.ruff.lint]
select = ["F", "I", "D"]
ignore = ["D100", "D104", "D413", "D204"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits live network data sources; deselected by default",
]
addopts = "-m 'not integration'"

[tool.ty.src]
exclude = ["notebooks"]

[tool.uv.sources]
# Fork carrying the Transfermarkt height fix; upstream 4.5.0 does not
# have it. uv.lock pins the exact commit, so this stays reproducible.
scraperfc = { git = "https://github.com/jme-taylor/ScraperFC", branch = "main" }
